name: Build Jarvis APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.8
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.8'

    - name: Run Unit Tests
      run: gradle test --stacktrace

    - name: Build Debug & Release APKs
      run: gradle assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-v3.1.3-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Create Release with Direct APK Download
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v3.1.3-build-${{ github.run_number }}
        name: Jarvis Assistant APK v3.1.3 (Build ${{ github.run_number }})
        body: |
          ### 🛠️ Jarvis Assistant v3.1.3 — Reconstrução da Arquitetura de Integrações (Build Code 11)

          **Principais Melhorias da Versão 3.1.3 (Baseada na estabilidade da V2.0.2 + recursos V3):**
          - 🧵 **Correção Definitiva de Threading (`Dispatchers.IO`):** `GeminiProvider` e `OpenRouterProvider` agora executam `testConnection` e `queryRemoteModels` em `Dispatchers.IO`, eliminando `NetworkOnMainThreadException`.
          - 🔐 **Keystore Singleton Seguro e Previsível:** Instância única (`getInstance`) com migração não-destrutiva (v1.1 + v2), sem sobrescrever chaves durante digitação e sem expor credenciais completas na interface.
          - 📦 **Catálogo Independente Persistido:** Modelos descobertos via API (Gemini paginado, OpenAI filtrado, Anthropic Claude, OpenRouter `/models`) são persistidos por provedor sem fallback fictício.
          - 🧠 **Smart Router Integrado ao Catálogo Real:** Respeita exatamente o provedor/modelo selecionado (ex.: `gemini-3.1-flash-lite`), política financeira e exibe o provedor/modelo escolhido ou o motivo de falha.
          - 💬 **Histórico Normalizado sem Duplicação:** Eliminação de corrida entre salvamento no Room e leitura do histórico no `ChatViewModel`; alternância estrita no Gemini e Claude.
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
