name: Build Jarvis APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.8
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.8'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-v2.0.0-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Create Release with Direct APK Download
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.0-build-${{ github.run_number }}
        name: Jarvis Assistant APK v2.0.0
        body: |
          ### 🤖 Jarvis Assistant v2.0.0 — Evolução Multiagente & Correção Crítica do Gemini

          **Novidades desta versão (V2.0.0):**
          - 🛠️ **Correção Definitiva do Google Gemini (HTTP 404):** Consulta em tempo real via `models.list` filtrando por suporte a `generateContent`, normalização de nomes sem prefixos inválidos e fallback resiliente automático.
          - 🧠 **Sistema Multiagente Completo:** Coordenação central do Jarvis com 4 agentes especializados (Programação, Pesquisa, Criativo, Analítico) acionados de acordo com a complexidade da solicitação.
          - 🔄 **Colaboração Interagente & Proteção Anti-Loop:** Compartilhamento seguro de contexto intermediário entre especialistas com limite estrito de até 3 passos para evitar loops.
          - 🏷️ **Badges de Agentes Colaboradores:** Visualização clara no chat de quais agentes trabalharam na síntese da resposta.
          - ⚙️ **Painel Multiagente em Configurações:** Controle de ativação e visualização das especialidades dos agentes.
          - 🎯 **Questionário Inteligente Calibrado:** Mapeamento de 8 responsabilidades com modelos reais e existentes.
          - 📱 **Versionamento:** `versionName = "2.0.0"`, `versionCode = 4`, mantendo o pacote `com.jarvis.assistant`.
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
