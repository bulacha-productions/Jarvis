name: Build Jarvis APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.8
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.8'

    - name: Run Unit Tests
      run: gradle test --stacktrace

    - name: Build Debug & Release APKs
      run: gradle assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-v3.1.0-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Create Release with Direct APK Download
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v3.1.0-build-${{ github.run_number }}
        name: Jarvis Assistant APK v3.1.0 (Build ${{ github.run_number }})
        body: |
          ### 🎙️ Jarvis Assistant v3.1.0 — Wake Word & Continuous Voice Activation (Build Code 8)
          
          **Principais Recursos e Inovações da Versão 3.1.0:**
          - 🗣️ **Detecção Local de Palavra-Chave ("Jarvis"):** Reconhecimento offline local com tolerância fonética no português brasileiro (`pt-BR`). Sem envio constante de áudio a servidores em nuvem, garantindo privacidade, baixo consumo de bateria e latência instantânea.
          - 🔄 **Foreground Service Especializado (`type="microphone"`):** Serviço em primeiro plano compatível com Android 14, 15 e 16 com notificação persistente, permitindo ativação mesmo com outros apps abertos ou tela bloqueada.
          - ⚙️ **Máquina de Estados de Voz Rigorosa:** Estados `INACTIVE`, `STARTING`, `LISTENING_FOR_WAKE_WORD`, `WAKE_WORD_DETECTED`, `LISTENING_FOR_COMMAND`, `PROCESSING`, `SPEAKING`, `PAUSED` e `ERROR`, evitando sobreposição de reconhecedores ou autoativação enquanto o assistente fala.
          - 🔕 **Proteção de Autoativação (Anti Self-Trigger):** O microfone é pausado durante a síntese de voz (TTS), impedindo que a voz do próprio Jarvis dispare comandos acidentalmente.
          - 📱 **Compatibilidade com Reinicialização (Boot Recovery):** Detecção segura de `BOOT_COMPLETED` em conformidade com as restrições do Android 12+, emitindo notificação interativa com 1 toque para inicialização autorizada do microfone sem violar diretrizes de segundo plano.
          - 🛠️ **Painel de Diagnóstico Completo (10 Testes):** Verificação individual de permissões (RECORD_AUDIO, POST_NOTIFICATIONS), hardware de microfone, compatibilidade pt-BR, serviço em primeiro plano, regex fonética, TTS nativo e persistência Room.
          - 🎛️ **Seção de Configurações do Sistema de Voz:** Status em tempo real, ativação automática, confirmação verbal ("Estou ouvindo"), leitura em voz alta (TTS), botões Iniciar, Pausar, Encerrar e testes rápidos de fala e TTS.
          - 🧠 **Preservação Arquitetural Completa:** Smart Router v3.0, Sistema Multiagente (1 ou 2 especialistas), Catálogo OpenRouter, Políticas Financeiras (Free/Paid), Keystore AES-256 e Histórico Room intactos.
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
