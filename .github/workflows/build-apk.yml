name: Build Jarvis APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.8
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.8'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-v1.1.0-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Create Release with Direct APK Download
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.0-build-${{ github.run_number }}
        name: Jarvis Assistant APK v1.1.0
        body: |
          ### 🤖 Jarvis Assistant v1.1.0 - Instalação no Celular
          
          **Novidades desta versão (V1.1):**
          - ✅ Correção definitiva no sistema de conversas (mensagens salvas em Room sem exclusão em cascata)
          - ✅ Correção do histórico: sem limites arbitrários de conversas e com rolagem completa
          - ✅ Seção de Provedores de IA (Google Gemini, OpenAI, Claude) com teste de conexão
          - ✅ Armazenamento seguro de chaves com Android Keystore / EncryptedSharedPreferences
          - ✅ Questionário de atribuição de responsabilidades de modelos (LIGHT, MEDIUM, HIGH)
          - ✅ Entrada de áudio via microfone (SpeechRecognizer)
          - ✅ Seletor de anexos oficiais do Android com prévia
          - ✅ Ícone oficial do Mascote 8-bit Voxel no launcher e aplicativos recentes
          - ✅ Suporte aprimorado a teclado (imePadding) e Window Insets
          - ✅ Versionamento atualizado: versionCode 2, versionName 1.1.0
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
