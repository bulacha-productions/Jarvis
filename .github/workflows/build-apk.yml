name: Build Jarvis APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.8
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.8'

    - name: Run Unit Tests
      run: gradle test --stacktrace

    - name: Build Debug & Release APKs
      run: gradle assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-v3.0.0-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Create Release with Direct APK Download
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v3.0.0-build-${{ github.run_number }}
        name: Jarvis Assistant APK v3.0.0 (Build ${{ github.run_number }})
        body: |
          ### 🚀 Jarvis Assistant v3.0.0 — Smart Intelligence Update (Build Code 7)
          
          **Principais Novidades e Evoluções da Versão 3.0.0:**
          - 🧠 **Jarvis Smart Router Independente:** Módulo desacoplado com análise inteligente de complexidade, tarefas (código, lógica, pesquisa, criatividade, anexos) e seleção automática de modelos e provedores. Suporta modos Automático, Manual e Automático com Preferência.
          - 👥 **Multiagente Avançado com Modo de 2 Especialistas:** Três modos configuráveis: 1 Especialista (menor latência/custo), 2 Especialistas (cooperação em cadeia com responsabilidades distintas + síntese central do Jarvis) e Automático. Modelos independentes por agente.
          - 💰 **Política Financeira & Proteção de Custos:** Modos "Somente Gratuitos" (bloqueio 100% estrito a cobranças), "Priorizar Gratuitos" e "Gratuitos e Pagos". Controle orçamentário mensal com cálculo prévio e rastreamento de consumo acumulado.
          - 🌐 **Catálogo Completo OpenRouter:** Descoberta em tempo real de modelos de múltiplas organizações (Meta, DeepSeek, Qwen, Mistral, Google, NVIDIA, etc.) com detecção de preços por milhão de tokens, modalidades e sufixos `:free`.
          - 🛠️ **Correção Multiturno Definitiva no Google Gemini:** Fim do erro `HTTP 400 — Multiturn chat is not enabled`. Normalização estrita de turnos, união de parts consecutivas e fallback inteligente para turno único estruturado.
          - 🎨 **Arquitetura de Ferramentas e Geração de Imagens:** Interceptação de instruções internas (como `{"action": "dalle.text2im", ...}`). Execução via DALL-E quando disponível ou orientação com prompt especializado sem vazamento de JSON para o usuário.
          - 📝 **Markdown Nativo, Blocos de Código & Link Previews:** Renderização completa de títulos, listas, citações, blocos de código com botão "Copiar", rolagem horizontal e pré-visualizações ricas de links (OpenGraph estilo WhatsApp) com proteção SSRF.
          - 💬 **Seleção de Texto e Edição de Mensagens:** `SelectionContainer` em todas as bolhas, cópia de trechos ou mensagens completas e edição de mensagens anteriores com reenvio consistente.
          - 🗄️ **Criação Tardia de Conversas (Lazy Creation):** Não acumula conversas vazias "Nova Conversa" no banco Room; conversas só são salvas ao enviar a primeira mensagem, com limpeza segura de registros vazios anteriores.
          - 🔊 **Voz e TTS Consolidado (pt-BR):** Reconhecimento de voz resiliente com permissões e nova síntese Text-to-Speech (TTS) com leitura de respostas e opção de auto-speak.
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
